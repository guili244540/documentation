[project]
name = "api-app"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "utils",
    "env",
    "mistralai>=3.6.0",
    "mistralai-workflows[mistralai]>=3.17.1",
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.14.1",
    "structlog>=25.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=0.25.3",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "api"

[tool.uv.sources]
utils = { workspace = true }
env = { workspace = true }
mistralai-workflows = { index = "pypi" }
